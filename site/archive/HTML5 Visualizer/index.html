<!DOCTYPE html>
<html>
    <head>
        <meta name="description" content="HTML5 Audio Spectrum Visualizer">
        <title>HTML5 Audio visualizer</title>
        <link type="text/css" rel="stylesheet" href="style/style.css">
    </head>
    <body>
        <div id="wrapper">
            <div id="fileWrapper" class="file_wrapper">
                <div id="info">
                    HTML5 Audio Visualizer
                </div>
                <label for="uploadedFile">Drag&drop or select a file to play:</label>
                <input type="file" id="uploadedFile"></input>
            </div>
            <div id="visualizer_wrapper" style="width: 1280px; height: 720px;
                background-image: url('BG.png');">
                <canvas id='canvas' width="1280" height="504" style="margin-top: 108px;"></canvas>
            </div>
        </div>
        <footer>
            <small>Star me on <a href="https://github.com/0xReki/HTML5-audio-visualizer" target="_blank">GitHub</a></small>
        </footer>
        <script src="js/html5_audio_visualizer.js"></script>
    </body>
</html>
