design:
  theme: classic
  page:
    size: a4
    show_top_note: false
    show_footer: true
  colors:
    name: '#9c2c2c'
    section_titles: '#9c2c2c'
  typography:
    alignment: left
    date_and_location_column_alignment: right
  header:
    connections:
      phone_number_format: national
  section_titles:
    type: with_full_line
  sections:
    allow_page_break: true
    show_time_spans_in: []
  entries:
    date_and_location_width: 3cm
  templates:
    single_date: YEAR-MONTH_IN_TWO_DIGITS
    date_range: START_DATE -- END_DATE
    education_entry:
      main_column: |-
        **AREA, INSTITUTION**
        SUMMARY
        HIGHLIGHTS
      degree_column: '**DEGREE**'
      date_and_location_column: |-
        LOCATION
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**
        **POSITION** 
        SUMMARY
        HIGHLIGHTS

