# Optimizations
compress_html:
  clippings: []
  comments: ["<!-- ", " -->"]
  endings: all
  blanklines: false
  profile: false
  startings: [html, head, body]

preload:
  fonts:
  - /assets/fonts/Cardo-Regular.woff2
  - /assets/fonts/Cardo-Bold.woff2
  - /assets/fonts/Source-Sans-Pro-Regular.woff2
  - /assets/fonts/Source-Sans-Pro-Bold.woff2

about:
  type: Person
  links:
    - https://twitter.com/0xReki
    - https://facebook.com/0xReki
    - https://twitch.tv/RPGReki
    - https://twitch.tv/RiichiReki
    - https://github.com/0xReki
    - https://instagram.com/oxreki
    - https://www.linkedin.com/in/q-thai-chung
    - https://www.xing.com/profile/Thai_Chung
    - https://amazon.com/author/0xreki
    - http://mahjong-europe.org/ranking/Players/05100170.htm
    - https://www.patreon.com/RWNS
    - https://www.scribblehub.com/profile/19792/0xreki/

liquid:
  error_mode: warn

wns:
  quads: true
  abbreviations: true

token:
  max: 2147483647
  mod:  899998
  plus: 100000

# Syntax
markdown: kramdown

# Comments
comments:
  action: /thanks-for-commenting/

