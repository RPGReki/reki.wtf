## Basic Configuration
title: "0xReki's Adventures by Night"
description: "Creative Writing, Mahjong and more!"
source: site
destination: docs

future: true

url: "https://reki.wtf"
static_url: "https://0xreki.de"

shorturl:
  - url: "https://amau.ga/"
    prefix: "/a/"
  - url: "https://cd-ht.ml/"
    prefix: "/cd/"
  - url: "https://cd-ht.ml/s/"
    prefix: "/s/"
#  - url: "https://cd-ht.ml/cat/"
#    prefix: '/cat/'

excerpt_separator: "<!--more-->"
feed: /feeds/chapters.xml
  
include:
  - ".dev"

permalink: pretty

### Copyright
copyright:
  license: <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a>
  name: quốc Thái “0xReki” Chung
  url: /about-me/


### SASS
sass:
  style: compressed
  cache: false

### Plugins
plugins:
  - jekyll-regex-replace
  - jekyll-include-cache
  - jekyll-liquify
  - jekyll-criticmarkup
  - jekyll-wns
  - jekyll-last-modified-at

## SEO
twitter:
  username: 0xReki
  card: summary
facebook:
  app_id: 656032504831426
tumblr:
  url: 0xreki.tumblr.com
google_analytics: UA-143950814-4
patreon:
  title: Become a Patron to read early access chapters
  url: https://www.patreon.com/RWNS
webmaster_verifications:
  - name: seobility
    key: efc87fbbcdcf8f61c070bbcc23dab8b1
  - name: "flattr:id"
    key: ol39pw
  - name: yandex-verification
    key: 323210d55347b761
favicon:
  href: /icon.svg
  type: image/svg+xml
alt-icon:
  href: /icon.ico
mask-icon:
  href: /mark-icon.svg
  color: '#9c2c2c'

# Optimizations
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: [p, li, td, rb, rp, rt, dt, dd, tr, td, th]
  blanklines: false
  profile: false
  startings: [html, head, body]
  ignore:
    envs: [unpublished]

preload:
  fonts:
  - /assets/fonts/Cardo-Regular.woff2
  - /assets/fonts/Cardo-Bold.woff2
  - /assets/fonts/SourceSans3-Regular.woff2
  - /assets/fonts/SourceSans3-Bold.woff2

liquid:
  error_mode: warn

token:
  max: 2147483647
  mod:  899998
  plus: 100000

# Syntax
markdown: kramdown

kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

wns:
  quads: true
  abbreviations: true
  label_unicode: true

# Comments
comments:
  action: /thanks-for-commenting/
  webhook: https://hook.integromat.com/qjrsmiidz9oc9favftmjfm35geqpgkp6

