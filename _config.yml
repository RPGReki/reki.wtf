## Basic Configuration
title: "0xReki's Adventures by Night"
description: "Creative Writing, Mahjong and more!"
source: site
destination: docs

url: "https://0xreki.de"
static_url: "https://static.0xreki.de"
shorturl:
  -
    url: "https://amau.ga/"
    prefix: "/a/"
  -
    url: "https://cd-ht.ml/"
    prefix: "/cd/"

excerpt_separator: "<!--more-->"
feed: /feeds/chapters.xml
exclude:
  - "build.sh"
  - "Gemfile"
  - "Gemfile.lock"
  - "LICENSE.md"
  - "README.md"
  - "**/*.xcf"
  - "**/.*"
  - "**/.map"
  - "_theme"
  - "**/Makefile"
include:
  - "_headers"
  - "_redirects"
permalink: pretty
future: true

### Copyright
copyright:
  license: <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a>
  name: Thai “0xReki” Chung
  url: https://0xreki.de/about-me/


### SASS
sass:
  style: compressed
  cache: false

### Plugins
plugins:
  - jekyll-last-modified-at
  - jekyll-regex-replace
  - jekyll-include-cache
  - jekyll-liquify
  - jekyll-criticmarkup
  - jekyll-wns

